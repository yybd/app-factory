<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">App Factory</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27325a"/>
      <stop offset="1" stop-color="#131a33"/>
    </linearGradient>
  </defs>
  <!-- the app-icon shape -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- the factory: a chimney and a three-tooth sawtooth roof -->
  <path d="M98 408V184h60v104l86-68v68l86-68v68l84-68v188z"
        fill="#f4f1ea" stroke="#f4f1ea" stroke-width="12" stroke-linejoin="round"/>
  <!-- three windows, each an app-icon shape -->
  <g fill="#1b2443">
    <rect x="176" y="324" width="50" height="50" rx="13"/>
    <rect x="254" y="324" width="50" height="50" rx="13"/>
    <rect x="332" y="324" width="50" height="50" rx="13"/>
  </g>
  <!-- what comes out of the chimney: apps, growing as they leave -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="113" y="120" width="30" height="30" rx="8" fill="#ff8a3d" transform="rotate(-8 128 135)"/>
    <g transform="rotate(10 172 86)">
      <rect x="149" y="63" width="46" height="46" rx="12" fill="#ffc145"/>
      <circle cx="172" cy="86" r="9" fill="#1b2443"/>
    </g>
    <g transform="rotate(-7 250 74)">
      <rect x="218" y="42" width="64" height="64" rx="17" fill="#3ecfb2"/>
      <path d="M241 59v30l24-15z" fill="#1b2443" stroke="#1b2443" stroke-width="5"/>
    </g>
    <g transform="rotate(9 362 108)">
      <rect x="319" y="65" width="86" height="86" rx="23" fill="#ff8a3d"/>
      <path d="M342 109l14 14 27-30" stroke="#f4f1ea" stroke-width="11"/>
    </g>
  </g>
</svg>
