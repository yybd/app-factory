schema_version: "1.1"
name: compliance-trigger-en
description: A plain English request to check an app against App Review loads app-store-review-compliance.
tags: [trigger, apple]
execution:
  prompt: |
    I'm about to submit my iOS app to the App Store. Before I do, can you check it against
    Apple's review guidelines and tell me what would get it rejected?
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: compliance-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?app-store-review-compliance"'
