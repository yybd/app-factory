schema_version: "1.1"
name: aso-field-audit
description: >-
  A listing with classic keyword-field faults planted: the English field repeats a
  subtitle word and names a competitor (Notion), and the Hebrew field spends room on a
  singular and its plural (תזכורת, תזכורות) — one stem, matched once by the store. The
  Hebrew field is 74 characters and 137 bytes: within the limit, which App Store Connect
  counts in characters, so a run that calls it over the limit is wrong.
  Needs --scaffold for the fixture.
tags: [behaviour, apple, aso]
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    This directory has my App Store listing in fastlane/metadata. Audit the keyword
    fields for ASO problems before I submit the next version, and tell me exactly what to
    change in each locale.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
graders:
  - name: hebrew-plural
    type: regex
    pattern: '(?i)תזכורות[^\n]{0,160}(plural|singular|stem|רבים|יחיד|כפול|twice|duplicate)|(plural|singular|stem|רבים|יחיד|כפול|twice|duplicate)[^\n]{0,160}תזכורות'
  - name: trademark
    type: regex
    pattern: '(?i)(notion[^\n]{0,120}(trademark|competitor|2\.3\.7))|((trademark|competitor|2\.3\.7)[^\n]{0,120}notion)'
  - name: subtitle-repeat
    type: regex
    pattern: '(?i)markdown[^\n]{0,120}(subtitle|already|repeat|redundant)|(subtitle|already|repeat|redundant)[^\n]{0,120}markdown'
