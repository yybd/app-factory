schema_version: "1.1"
name: stays-quiet
description: A request that has nothing to do with shipping an Apple app loads no apple-track skill. Sixteen skills with broad descriptions are sixteen chances to fire where they should not.
tags: [trigger, negative, apple]
execution:
  prompt: |
    Write a Python function that takes a list of integers and returns the second largest
    distinct value, or None when there is none. Include two short tests.
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-apple-skill
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    arm: both
  - name: answered
    type: regex
    pattern: 'def \w+\('
